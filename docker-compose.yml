services:
  backend:
    build: ./backend
    container_name: manualarr-backend
    volumes:
      - manual_data:/app/data
      - manual_uploads:/app/uploads
    # Override database URL to point to the volume
    environment:
      - DATABASE_URL=sqlite:////app/data/manualarr.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: manualarr-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  manual_data:
  manual_uploads:
