# Ollama Integration Guide

You can use Ollama with Home Assistant via the **Extended OpenAI Conversation** integration, because Ollama provides an OpenAI-compatible API.

## Prerequisites

1.  **Ollama Server**: Running and accessible from Home Assistant.
2.  **Model**: A model that supports function calling is highly recommended (e.g., `llama3.1`, `mistral`, `qwen2.5`).

## Step 1: Configure Extended OpenAI Conversation

When adding or configuring the integration in Home Assistant:

1.  **Name**: Ollama (or whatever you prefer)
2.  **Base URL**: `http://<your-ollama-ip>:11434/v1`
    *   *Note: If running as a HA Add-on, use `http://<addon-slug>:11434/v1`*
3.  **API Key**: `ollama` (placeholder, usually required but ignored)
4.  **Model**: Enter the exact model name you pulled in Ollama (e.g., `llama3.1:8b`)

## Step 2: Add the Search Tool

Use the YAML configuration from the [Extended OpenAI Conversation Template](./extended-openai-conversation.yaml).

Copy the `functions:` block into the prompt configuration dialog of the integration.

## Troubleshooting

- **"Model does not support function calling"**: Ensure you are using a model version that supports tools.
- **Connection Refused**: Verify Home Assistant can reach your Ollama IP/port.