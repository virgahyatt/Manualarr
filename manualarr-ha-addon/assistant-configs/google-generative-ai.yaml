# Google Generative AI Workaround Template

For Google Gemini models, use this script-based approach since the built-in integration has limited tool support.

## configuration.yaml

```yaml
rest_command:
  search_manuals:
    url: "http://homeassistant.local:8081/api/search/context"
    method: GET
    query_params:
...
```

## Setup

1.  **Expose Port:** Map container port `8080` to host port `8081` in the Add-on Configuration (Network).
2.  **Update URL:** Replace `http://homeassistant.local:8081` with your HA IP and mapped port.

Expose the `script.search_product_manuals` to your Google Generative AI assistant.
