        "properties": {
          "query": { "type": "string", "description": "Search terms" },
          "brand": { "type": "string", "description": "Optional brand" },
          "model": { "type": "string", "description": "Optional model" }
        },
        "required": ["query"]
      }
    },
    "function": {
      "type": "rest",
      "resource_template": "http://homeassistant.local:8081/api/search/context?q={{ query|urlencode }}&brand={{ brand|default('')|urlencode }}&model={{ model|default('')|urlencode }}&limit=10",
      "method": "GET"
    }
  }
]
```

## Important Setup Steps

1.  **Expose the Port:**
    - Go to **Settings** > **Add-ons** > **Manualarr** > **Configuration**.
    - In the **Network** section, map port `8080` to a host port (e.g., `8081`).
    - Save and restart the add-on.

2.  **Update URL:**
    - Replace `http://homeassistant.local:8081` in the configuration above with your Home Assistant IP/hostname and the mapped port (e.g., `8081`).
