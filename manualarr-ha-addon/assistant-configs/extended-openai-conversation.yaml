# Extended OpenAI Conversation Template

Use this configuration with the [Extended OpenAI Conversation](https://github.com/jekalmin/extended_openai_conversation) integration in Home Assistant.

## Configuration

**Append** the following block to the **Functions** text area in the integration configuration. 

> **Note:** Home Assistant may show a warning saying *"It appears you may be writing YAML into this template field"*. You can safely **ignore this warning** and click Submit.

### YAML Version
```yaml
- spec:
    name: search_manuals
    description: >-
      Search product manuals for specifications, instructions, troubleshooting,
      or any other information. Use this when the user asks about their devices,
      appliances, equipment, or products they own.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: >-
            Search terms to find in manuals (e.g., "max temperature",
            "error code E3", "installation steps", "warranty period")
        brand:
          type: string
          description: >-
            Optional brand filter (e.g., "ECO-WORTHY", "Eco-Spa", "Samsung")
        model:
          type: string
          description: >-
            Optional model number filter (e.g., "E3", "ECO-LFP4810002")
      required:
        - query
  function:
    type: rest
    resource_template: >-
      http://homeassistant.local:8081/api/search/context?q={{ query|urlencode }}&brand={{ brand|default('')|urlencode }}&model={{ model|default('')|urlencode }}&limit=5
    method: GET
```

### JSON Version (Alternative)
If the YAML version causes issues with the validator, use this JSON version:

```json
{
  "spec": {
    "name": "search_manuals",
    "description": "Search product manuals for specifications, instructions, troubleshooting, or any other information.",
    "parameters": {
      "type": "object",
      "properties": {
        "query": { "type": "string", "description": "Search terms" },
        "brand": { "type": "string", "description": "Optional brand" },
        "model": { "type": "string", "description": "Optional model" }
      },
      "required": ["query"]
    }
  },
  "function": {
    "type": "rest",
    "resource_template": "http://homeassistant.local:8081/api/search/context?q={{ query|urlencode }}&brand={{ brand|default('')|urlencode }}&model={{ model|default('')|urlencode }}&limit=5",
    "method": "GET"
  }
}
```

## Important Setup Steps

1.  **Expose the Port:**
    - Go to **Settings** > **Add-ons** > **Manualarr** > **Configuration**.
    - In the **Network** section, map port `8080` to a host port (e.g., `8081`).
    - Save and restart the add-on.

2.  **Update URL:**
    - Replace `http://homeassistant.local:8081` in the configuration above with your Home Assistant IP/hostname and the mapped port (e.g., `8081`).
