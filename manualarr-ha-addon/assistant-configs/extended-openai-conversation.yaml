# Extended OpenAI Conversation Template

Use this configuration with the [Extended OpenAI Conversation](https://github.com/jekalmin/extended_openai_conversation) integration in Home Assistant.

## Step 3: Configure the Tool

In Extended OpenAI Conversation **Functions** box, append these tools.

### Recommended System Prompt
Add this to the **Prompt** field at the top of the integration configuration:
```text
You are a helpful home assistant with access to the user's product manual library.
1. ALWAYS use the 'list_manuals' tool first to identify what products the user owns. 
2. Trust the 'brand' and 'model' fields in the returned list as the authoritative identification of their equipment.
3. Use 'search_manuals' to find specific technical details, specs, or instructions INSIDE the manuals.
4. If a tool returns no results, do not hallucinate; tell the user you couldn't find the information in their manuals.
```

### YAML Version (Recommended)
```yaml
- spec:
    name: list_manuals
    description: >-
      List all product manuals the user has indexed. Use this to see what 
      products the user owns or when they ask "what devices do I have?".
    parameters:
      type: object
      properties: {}
  function:
    type: rest
    resource: http://homeassistant.local:8081/api/manuals/
    method: GET

- spec:
    name: search_manuals
    description: >-
      Search the contents of the user's product manuals for specifications, 
      instructions, or troubleshooting. The results include the verified 
      brand and model of the product.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: >-
            Search terms to find in manuals (e.g., "max temperature",
            "error code E3", "installation steps", "warranty period")
        brand:
          type: string
          description: >-
            Optional brand filter (e.g., "ECO-WORTHY", "Eco-Spa", "Samsung")
        model:
          type: string
          description: >-
            Optional model number filter (e.g., "E3", "ECO-LFP4810002")
      required:
        - query
  function:
    type: rest
    resource_template: >-
      http://homeassistant.local:8081/api/search/context?q={{ query|urlencode }}&brand={{ brand|default('')|urlencode }}&model={{ model|default('')|urlencode }}&limit=10
    method: GET
```

### JSON Version
```json
[
  {
    "spec": {
      "name": "list_manuals",
