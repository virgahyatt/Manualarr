# Extended OpenAI Conversation - Reliable Setup

The most robust way to integrate Manualarr is to define a **REST Command** in your Home Assistant configuration and then expose it as a tool. This avoids template rendering issues within the integration.

## Step 1: Add to configuration.yaml

Add the following to your `configuration.yaml` file (using File Editor or Studio Code Server):

```yaml
rest_command:
  search_manuals:
    url: "http://10.101.2.11:8081/api/search/context"
    method: POST
    headers:
      Content-Type: application/json
    payload: >-
      {{
        {
          "q": query,
          "brand": brand | default(None),
          "model": model | default(None),
          "limit": 5
        } | to_json
      }}
```

**Note:** Replace `http://10.101.2.11:8081` with your actual Home Assistant IP and the mapped port.

## Step 2: Restart Home Assistant

Restart to load the new command.

## Step 3: Configure the Tool

In Extended OpenAI Conversation **Functions** box, use this configuration to call the command:

### YAML Version
```yaml
- spec:
    name: search_manuals
    description: >-
      Search product manuals for specifications, instructions, troubleshooting,
      or any other information. Use this when the user asks about their devices,
      appliances, equipment, or products they own.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: >-
            Search terms to find in manuals (e.g., "max temperature",
            "error code E3", "installation steps", "warranty period")
        brand:
          type: string
          description: >-
            Optional brand filter (e.g., "ECO-WORTHY", "Eco-Spa", "Samsung")
        model:
          type: string
          description: >-
            Optional model number filter (e.g., "E3", "ECO-LFP4810002")
      required:
        - query
  function:
    type: script
    sequence:
      - service: rest_command.search_manuals
        data:
          query: "{{ query }}"
          brand: "{{ brand }}"
          model: "{{ model }}"
```

### JSON Version
```json
{
  "spec": {
    "name": "search_manuals",
    "description": "Search product manuals for specifications, instructions, troubleshooting, or any other information.",
    "parameters": {
      "type": "object",
      "properties": {
        "query": { "type": "string", "description": "Search terms" },
        "brand": { "type": "string", "description": "Optional brand" },
        "model": { "type": "string", "description": "Optional model" }
      },
      "required": ["query"]
    }
  },
  "function": {
    "type": "script",
    "sequence": [
      {
        "service": "rest_command.search_manuals",
        "data": {
          "query": "{{ query }}",
          "brand": "{{ brand }}",
          "model": "{{ model }}"
        }
      }
    ]
  }
}
```
